<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>照片相册</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;max-width:960px;margin:0 auto;padding:16px;background:#f5f6f7;line-height:1.6}h1{font-size:26px;color:#d62828;border-bottom:3px solid #d62828;padding-bottom:12px;margin:0 0 6px}.sub{color:#888;font-size:13px;margin:0 0 14px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}figure{margin:0;cursor:pointer;overflow:hidden;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}figure img{width:100%;height:150px;object-fit:cover;display:block}#viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:99;text-align:center}#viewer img{max-width:100%;max-height:100%;width:auto;height:auto;margin:auto;position:absolute;inset:0}#vClose{position:fixed;top:10px;right:16px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;z-index:100}#vCount{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:99px;z-index:100}#vPrev,#vNext{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:none;font-size:34px;width:52px;height:64px;cursor:pointer;border-radius:8px;z-index:100}#vPrev{left:8px}#vNext{right:8px}</style>
</head>
<body>
<h1>照片相册</h1>
<p class="sub">共 2 张 · 点照片放大，左右滑动或按 ←/→ 翻看，点 ✕ 或按 Esc 关闭</p>
<div class="gallery">
<figure data-i="0"><img loading="lazy" src="https://SJL-123-Code.github.io/qr-files/1.jpg" alt="1.jpg"></figure>
<figure data-i="1"><img loading="lazy" src="https://SJL-123-Code.github.io/qr-files/2.jpg" alt="2.jpg"></figure>
</div>
<div id="viewer">
<button id="vClose">✕</button>
<span id="vCount"></span>
<button id="vPrev">‹</button>
<img id="vImg" alt="">
<button id="vNext">›</button>
</div>
<script>
var photos=["https://SJL-123-Code.github.io/qr-files/1.jpg","https://SJL-123-Code.github.io/qr-files/2.jpg"];
var cur=-1,startX=0;
var v=document.getElementById("viewer"),vImg=document.getElementById("vImg"),vCount=document.getElementById("vCount");
function show(i){ if(i<0)i=photos.length-1; if(i>=photos.length)i=0; cur=i; vImg.src=photos[i]; vCount.textContent=(i+1)+" / "+photos.length; }
function closeV(){ v.style.display="none"; }
document.querySelectorAll("figure").forEach(function(f){ f.addEventListener("click",function(){ v.style.display="block"; show(+f.dataset.i); }); });
document.getElementById("vClose").onclick=closeV;
document.getElementById("vPrev").onclick=function(){ show(cur-1); };
document.getElementById("vNext").onclick=function(){ show(cur+1); };
document.addEventListener("keydown",function(e){ if(v.style.display!=="block")return; if(e.key==="Escape")closeV(); if(e.key==="ArrowLeft")show(cur-1); if(e.key==="ArrowRight")show(cur+1); });
v.addEventListener("touchstart",function(e){ startX=e.touches[0].clientX; });
v.addEventListener("touchend",function(e){ var dx=e.changedTouches[0].clientX-startX; if(dx>40)show(cur-1); else if(dx<-40)show(cur+1); });
</script>
</body>
</html>
